identifier = "com.qsentech.oak4-yolopv2-standalone"
app_version = "0.33.10"
entrypoint = ["bash", "-c", "/usr/bin/runsvdir -P /etc/service"]
assign_frontend_port = false

prepare_container = [
    { type = "COPY", source = "./requirements.txt", target = "./requirements.txt" },
    { type = "COPY", source = "./install-runtime.sh", target = "./install-runtime.sh" },
    { type = "RUN", command = "sh /app/install-runtime.sh" },
]

build_steps = [
    "mkdir -p /etc/service/backend",
    "cp /app/backend-run.sh /etc/service/backend/run",
    "chmod +x /etc/service/backend/run",
]

[base_image]
api_url = "https://registry-1.docker.io"
service = "registry.docker.io"
oauth_url = "https://auth.docker.io/token"
auth_type = "repository"
auth_name = "library/python"
image_name = "library/python"
image_tag = "3.12.11-slim-bookworm"
